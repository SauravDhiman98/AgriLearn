spring:
  application:
    name: agrilearn-backend

  # ===== MAIL CONFIGURATION =====
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:tassypoint.learn@gmail.com}
    password: "${MAIL_PASSWORD:yraj zise rgky eoaq}"
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  # ===== DATABASE =====
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/agrilearn}
    username: ${SPRING_DATASOURCE_USERNAME:agrilearn}
    password: ${SPRING_DATASOURCE_PASSWORD:agrilearn123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      connection-init-sql: SET TIME ZONE 'UTC'

  # ===== JPA / HIBERNATE =====
  jpa:
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public

  # ===== FLYWAY =====
  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: ${FLYWAY_VALIDATE:false}
    out-of-order: false
    locations: classpath:db/migration

  # ===== FILE UPLOAD =====
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

# ===== SERVER =====
server:
  port: ${PORT:8080}
  servlet:
    context-path: /api/v1

# ===== CORS =====
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

# ===== JWT =====
jwt:
  secret: ${JWT_SECRET:agrilearn-jwt-secret-key-change-in-production-minimum-256-bits-long}
  expiration: 86400000
  refresh-expiration: 604800000

# ===== MINIO / FILE STORAGE =====
minio:
  url: ${MINIO_URL:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:agrilearn}
  secret-key: ${MINIO_SECRET_KEY:agrilearn123}
  region: ${MINIO_REGION:us-east-1}
  local: ${MINIO_LOCAL:true}
  local-dir: ${MINIO_LOCAL_DIR:uploads}
  bucket:
    videos: ${MINIO_BUCKET_VIDEOS:agrilearn-videos}
    thumbnails: ${MINIO_BUCKET_THUMBNAILS:agrilearn-thumbnails}
    documents: ${MINIO_BUCKET_DOCUMENTS:agrilearn-documents}
    avatars: ${MINIO_BUCKET_AVATARS:agrilearn-avatars}

# ===== RAZORPAY =====
razorpay:
  key-id: ${RAZORPAY_KEY_ID:rzp_test_placeholder}
  key-secret: ${RAZORPAY_KEY_SECRET:placeholder_secret}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:placeholder_webhook_secret}

# ===== AI PROVIDERS =====
gemini:
  api-key: ${GEMINI_API_KEY:}

github:
  models:
    token: ${GITHUB_TOKEN:}

# ===== APP CONFIGURATION =====
app:
  frontend-url: ${FRONTEND_URL:https://tassypoint.in}
  email:
    enabled: ${MAIL_ENABLED:true}

# ===== RESEND EMAIL API =====
resend:
  api-key: ${RESEND_API_KEY:}
  from: ${RESEND_FROM:Tassy Point <tassypoint.learn@gmail.com>}

# ===== SPRINGDOC / SWAGGER =====
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

# ===== ACTUATOR =====
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    mail:
      enabled: false
    diskspace:
      enabled: false

# ===== LOGGING =====
logging:
  file:
    name: ${LOG_FILE:logs/agrilearn.log}
  level:
    root: INFO
    com.agrilearn: ${LOG_LEVEL_APP:DEBUG}
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p --- [%15.15t] %-40.40logger{39} : %m%n%wEx"