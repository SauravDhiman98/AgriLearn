spring:
  application:
    name: agrilearn-backend

  # datasource — set SPRING_DATASOURCE_URL / USERNAME / PASSWORD in Railway
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/agrilearn}
    username: ${SPRING_DATASOURCE_USERNAME:agrilearn}
    password: ${SPRING_DATASOURCE_PASSWORD:agrilearn123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      connection-init-sql: SET TIME ZONE 'UTC'

  jpa:
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyJpaCompliantImpl
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public

  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: ${FLYWAY_VALIDATE:false}
    out-of-order: false
    locations: classpath:db/migration

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

server:
  port: ${PORT:8080}
  servlet:
    context-path: /api/v1

# CORS — set CORS_ALLOWED_ORIGINS in Railway to your frontend URL
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:agrilearn-jwt-secret-key-change-in-production-minimum-256-bits-long}
  expiration: 86400000       # 24 hours in ms
  refresh-expiration: 604800000  # 7 days in ms

# MinIO / File Storage
minio:
  url: ${MINIO_URL:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:agrilearn}
  secret-key: ${MINIO_SECRET_KEY:agrilearn123}
  region: ${MINIO_REGION:us-east-1}
  # Set minio.local=true for local dev (no MinIO/B2 needed — files stored on disk)
  local: ${MINIO_LOCAL:true}
  local-dir: ${MINIO_LOCAL_DIR:uploads}
  bucket:
    videos: ${MINIO_BUCKET_VIDEOS:agrilearn-videos}
    thumbnails: ${MINIO_BUCKET_THUMBNAILS:agrilearn-thumbnails}
    documents: ${MINIO_BUCKET_DOCUMENTS:agrilearn-documents}
    avatars: ${MINIO_BUCKET_AVATARS:agrilearn-avatars}

# Razorpay Payment Gateway
razorpay:
  key-id: ${RAZORPAY_KEY_ID:rzp_test_placeholder}
  key-secret: ${RAZORPAY_KEY_SECRET:placeholder_secret}
  webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:placeholder_webhook_secret}

# Google Gemini / GitHub Models AI
gemini:
  api-key: ${GEMINI_API_KEY:}

# GitHub Models (fallback AI provider)
github:
  models:
    token: ${GITHUB_TOKEN:}

# App configuration
app:
  frontend-url: ${FRONTEND_URL:https://agrilearn-4qhy.onrender.com}
  email:
    # Set MAIL_ENABLED=true + MAIL_USERNAME + MAIL_PASSWORD in Railway to enable real email sending.
    # When false, reset links are printed to logs only (safe default for dev/staging).
    enabled: ${MAIL_ENABLED:false}

# Springdoc OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

# Spring Boot Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true   # enables /health/liveness and /health/readiness
  health:
    mail:
      enabled: false    # mail SMTP not available on startup → don't check it
    diskspace:
      enabled: false

# Logging
logging:
  file:
    name: ${LOG_FILE:logs/agrilearn.log}
  level:
    root: INFO
    com.agrilearn: ${LOG_LEVEL_APP:DEBUG}
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p --- [%15.15t] %-40.40logger{39} : %m%n%wEx"
