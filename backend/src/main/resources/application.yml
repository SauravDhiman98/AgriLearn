spring:
  application:
    name: agrilearn-backend

  # datasource is configured in DataSourceConfig.java — handles both Railway (DATABASE_URL) and local dev

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

server:
  port: ${PORT:8080}
  servlet:
    context-path: /api/v1

# CORS — set CORS_ALLOWED_ORIGINS in Railway to your frontend URL
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:agrilearn-jwt-secret-key-change-in-production-minimum-256-bits-long}
  expiration: 86400000       # 24 hours in ms
  refresh-expiration: 604800000  # 7 days in ms

# MinIO / File Storage
minio:
  url: ${MINIO_URL:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:agrilearn}
  secret-key: ${MINIO_SECRET_KEY:agrilearn123}
  bucket:
    videos: agrilearn-videos
    thumbnails: agrilearn-thumbnails
    documents: agrilearn-documents
    avatars: agrilearn-avatars

# Razorpay Payment Gateway
razorpay:
  key-id: ${RAZORPAY_KEY_ID:}
  key-secret: ${RAZORPAY_KEY_SECRET:}

# Springdoc OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

# Spring Boot Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true   # enables /health/liveness and /health/readiness
  health:
    mail:
      enabled: false    # mail SMTP not available on startup → don't check it
    diskspace:
      enabled: false

# Logging
logging:
  file:
    name: ${LOG_FILE:logs/agrilearn.log}
  level:
    root: INFO
    com.agrilearn: ${LOG_LEVEL_APP:DEBUG}
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p --- [%15.15t] %-40.40logger{39} : %m%n%wEx"
