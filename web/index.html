<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tassy Point — Free Education Center</title>
    <meta name="description" content="Learn smart, crack exams — video lectures, community forum & study materials for competitive exam aspirants." />
    <!-- Apply theme before React loads to prevent flash -->
    <script>
      (function () {
        var stored = localStorage.getItem('theme');
        if (stored === 'dark') {
          document.documentElement.classList.add('dark');
        } else if (!stored) {
          // Default to light; only go dark if explicitly set
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
