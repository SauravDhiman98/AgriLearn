# Monitor & Restart (Railway)
# - Add these repository secrets before enabling the workflow:
#   - HEALTH_URL: http(s) URL to your service health endpoint (e.g. https://your-app.railway.app/health)
#   - RAILWAY_TOKEN: Railway API token
#   - RAILWAY_PROJECT_ID: Railway project ID for your app
#   - RAILWAY_SERVICE_ID: Railway service ID for the service to restart
#
# Schedule: every 5 minutes. You can change the cron below if you prefer a different interval.

name: Monitor & Restart (Railway)

on:
  schedule:
    - cron: '*/5 * * * *' # every 5 minutes
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    env:
      HEALTH_URL: https://tassy-point-production.up.railway.app/health
      RAILWAY_TOKEN: dd365ac3-376a-406e-998b-853c6a160972
      RAILWAY_PROJECT_ID: 10309468-d800-4d7e-8129-240ee9c4bb9
      RAILWAY_SERVICE_ID: 0cafb356-132b-4655-9ed5-3b3bdb627431

    steps:
      - name: Check health endpoint (3 attempts)
        id: check
        run: |
          failures=0
          for i in 1 2 3; do
            status=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL" || echo "000")
            echo "Attempt $i: status=$status"
            if [ "$status" = "200" ]; then
              echo "healthy"
              echo "failures=0" >> $GITHUB_OUTPUT
              exit 0
            fi
            failures=$((failures+1))
            sleep 5
          done
          echo "failures=$failures" >> $GITHUB_OUTPUT

      - name: Restart Railway service
        if: steps.check.outputs.failures == '3'
        run: |
          echo "Health check failed 3 times — restarting Railway service..."
          # Railway API: attempt to restart the service. Adjust endpoint if your Railway API path differs.
          resp=$(curl -sS -X POST \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            "https://api.railway.app/v1/projects/$RAILWAY_PROJECT_ID/services/$RAILWAY_SERVICE_ID/restart") || true
          echo "$resp" > /tmp/railway-restart-response.json || true
          cat /tmp/railway-restart-response.json || true

      - name: Post-restart quick check
        if: steps.check.outputs.failures == '3'
        run: |
          sleep 10
          status=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL" || echo "000")
          echo "post_restart_status=$status" >> $GITHUB_OUTPUT
